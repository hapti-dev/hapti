[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hapti"
version = "0.2.0"
description = "Hapti: an agent that does tasks on any website by sight, paid only when it succeeds"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://hapti.dev"
Documentation = "https://hapti.dev/docs/"
